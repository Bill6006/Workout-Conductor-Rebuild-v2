name: Deploy to GitHub Pages

# The permanent live link. Every push to main is fully verified first; the
# deploy job only runs if the build job succeeded, so a broken commit leaves
# the last working deployment in place.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight - that is what leaves Pages in a half state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 1. install
      - name: Install dependencies
        run: npm ci

      # 2. lint
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # 3. type-check
      - name: Type-check
        run: npm run typecheck

      # 4. unit tests
      - name: Unit tests
        run: npm run test

      # 5. build
      - name: Build
        run: npm run build

      # 6. privacy scan - must pass before anything reaches a public site
      - name: Privacy scan
        run: npm run privacy:scan

      - name: Verify build output
        run: npm run verify:build

      - name: Check no source is excluded by .gitignore
        run: npm run check:tracked

      # 7. browser smoke test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 8. deploy
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
